<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Face Scan Attendance System</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Load face-api.js without defer to ensure it loads before the inline script -->
    <script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api/dist/face-api.js"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
            background-color: #f3f4f6;
        }
        #video-container {
            position: relative;
            width: 100%;
            max-width: 640px;
            margin: 0 auto;
            border-radius: 0.5rem;
            overflow: hidden;
            background-color: #000;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.1), 0 4px 6px -2px rgba(0, 0, 0, 0.05);
        }
        #video {
            width: 100%;
            height: auto;
            display: block;
        }
        canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
        }
        .toast {
            transition: opacity 0.3s ease-in-out, transform 0.3s ease-in-out;
            opacity: 0;
            transform: translateY(-20px);
            pointer-events: none;
        }
        .toast.show {
            opacity: 1;
            transform: translateY(0);
        }
        /* Loading spinner */
        .loader {
            border: 4px solid #f3f3f3;
            border-radius: 50%;
            border-top: 4px solid #3b82f6;
            width: 40px;
            height: 40px;
            -webkit-animation: spin 1s linear infinite; /* Safari */
            animation: spin 1s linear infinite;
        }
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
    </style>
</head>
<body class="text-gray-800 h-screen flex flex-col">

    <nav class="bg-blue-600 text-white shadow-md p-4">
        <div class="container mx-auto flex justify-between items-center">
            <h1 class="text-2xl font-bold flex items-center gap-2">
                <i class="fa-solid fa-users-viewfinder"></i> FaceCheck
            </h1>
            <div id="status-badge" class="bg-yellow-500 text-yellow-900 text-xs font-bold px-3 py-1 rounded-full flex items-center gap-2">
                <i class="fa-solid fa-spinner fa-spin"></i> Loading Models...
            </div>
        </div>
    </nav>

    <main class="container mx-auto flex-grow p-4 flex flex-col lg:flex-row gap-6 overflow-hidden">
        
        <!-- Left Column: Camera and Controls -->
        <div class="w-full lg:w-1/2 flex flex-col gap-4">
            
            <div class="bg-white p-4 rounded-xl shadow-md flex-grow flex flex-col">
                <h2 class="text-lg font-semibold mb-3 border-b pb-2">Camera Feed</h2>
                
                <div id="video-container" class="flex-grow flex items-center justify-center relative">
                    <!-- Initial loader before video starts -->
                    <div id="video-loader" class="absolute inset-0 flex flex-col items-center justify-center bg-gray-900 text-white z-10">
                        <div class="loader mb-4"></div>
                        <p>Initializing Camera...</p>
                    </div>
                    <video id="video" autoplay muted playsinline></video>
                    <!-- Canvas will be injected here by JS -->
                </div>

                <div class="mt-4 flex gap-2">
                    <button id="btn-scan" class="flex-1 bg-green-500 hover:bg-green-600 text-white py-3 rounded-lg font-bold transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        <i class="fa-solid fa-expand"></i> Scan & Check-in
                    </button>
                    <button id="btn-register-mode" class="flex-1 bg-blue-500 hover:bg-blue-600 text-white py-3 rounded-lg font-bold transition flex items-center justify-center gap-2 disabled:opacity-50 disabled:cursor-not-allowed" disabled>
                        <i class="fa-solid fa-user-plus"></i> Register New Face
                    </button>
                </div>
            </div>

            <!-- Registration Form (Hidden by default) -->
            <div id="registration-panel" class="bg-white p-4 rounded-xl shadow-md hidden transition-all duration-300">
                <h3 class="text-lg font-semibold mb-2 text-blue-600"><i class="fa-solid fa-id-card"></i> Register Employee</h3>
                <p class="text-sm text-gray-600 mb-3">Position your face clearly in the camera and enter your name.</p>
                <div class="flex gap-2">
                    <input type="text" id="employee-name" placeholder="Enter Full Name" class="flex-1 border border-gray-300 rounded-lg px-3 py-2 focus:outline-none focus:border-blue-500 focus:ring-1 focus:ring-blue-500">
                    <button id="btn-save-face" class="bg-blue-600 hover:bg-blue-700 text-white px-4 py-2 rounded-lg font-semibold transition">
                        Save Face
                    </button>
                </div>
                <button id="btn-cancel-register" class="mt-2 text-sm text-gray-500 hover:text-gray-800 underline">Cancel</button>
            </div>
        </div>

        <div class="w-full lg:w-1/2 flex flex-col gap-4 overflow-hidden">
            
            <!-- Attendance Log -->
            <div class="bg-white rounded-xl shadow-md flex-grow flex flex-col overflow-hidden">
                <div class="p-4 border-b bg-gray-50 flex justify-between items-center">
                    <h2 class="text-lg font-semibold"><i class="fa-solid fa-clipboard-list text-gray-500"></i> Today's Attendance</h2>
                    <button id="btn-clear-logs" class="text-xs text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-2 py-1 rounded">Clear Logs</button>
                </div>
                <div class="overflow-y-auto flex-grow p-0">
                    <table class="w-full text-left border-collapse">
                        <thead class="bg-gray-100 sticky top-0">
                            <tr>
                                <th class="p-3 text-sm font-semibold text-gray-600 border-b">Time</th>
                                <th class="p-3 text-sm font-semibold text-gray-600 border-b">Name</th>
                                <th class="p-3 text-sm font-semibold text-gray-600 border-b">Status</th>
                            </tr>
                        </thead>
                        <tbody id="attendance-log-body" class="text-sm divide-y divide-gray-100">
                            <!-- Logs will be inserted here -->
                            <tr>
                                <td colspan="3" class="p-8 text-center text-gray-400">No scans recorded yet.</td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>

            <!-- Registered Users -->
            <div class="bg-white rounded-xl shadow-md h-1/3 flex flex-col overflow-hidden">
                <div class="p-3 border-b bg-gray-50 flex justify-between items-center">
                    <h3 class="font-semibold text-sm"><i class="fa-solid fa-users text-gray-500"></i> Registered Faces (<span id="user-count">0</span>)</h3>
                    <button id="btn-clear-users" class="text-xs text-red-500 hover:text-red-700 bg-red-50 hover:bg-red-100 px-2 py-1 rounded">Clear All Data</button>
                </div>
                <div class="overflow-y-auto p-3">
                    <ul id="registered-users-list" class="space-y-2 text-sm text-gray-600 flex flex-wrap gap-2">
                        <!-- Users will be listed here as pills -->
                        <li class="text-gray-400 italic w-full text-center py-4" id="no-users-msg">No faces registered. Please register a face first.</li>
                    </ul>
                </div>
            </div>
        </div>
    </main>

    <div id="toast-container" class="fixed top-5 left-1/2 transform -translate-x-1/2 z-50 flex flex-col gap-2 pointer-events-none"></div>

    <script>
        // Use a reliable repo for models (vladmandic's fork is highly maintained for TFJS/FaceAPI)
        const MODEL_URL = 'https://cdn.jsdelivr.net/npm/@vladmandic/face-api/model/';
        
        const video = document.getElementById('video');
        const videoContainer = document.getElementById('video-container');
        const videoLoader = document.getElementById('video-loader');
        
        // Buttons
        const btnScan = document.getElementById('btn-scan');
        const btnRegisterMode = document.getElementById('btn-register-mode');
        const btnSaveFace = document.getElementById('btn-save-face');
        const btnCancelRegister = document.getElementById('btn-cancel-register');
        const btnClearLogs = document.getElementById('btn-clear-logs');
        const btnClearUsers = document.getElementById('btn-clear-users');
        
        // Panels & Inputs
        const registrationPanel = document.getElementById('registration-panel');
        const employeeNameInput = document.getElementById('employee-name');
        const statusBadge = document.getElementById('status-badge');
        
        // State
        let modelsLoaded = false;
        let isCameraReady = false;
        let faceMatcher = null; // Will hold the face-api.js FaceMatcher instance
        let canvas;
        let detectionInterval;
        let currentMode = 'scan'; // 'scan' or 'register'

        // Data Storage Keys
        const STORAGE_KEY_USERS = 'face_attendance_users';
        const STORAGE_KEY_LOGS = 'face_attendance_logs';

        // Load data from LocalStorage
        let registeredUsers = JSON.parse(localStorage.getItem(STORAGE_KEY_USERS)) || [];
        let attendanceLogs = JSON.parse(localStorage.getItem(STORAGE_KEY_LOGS)) || [];

        function showToast(message, type = 'info') {
            const container = document.getElementById('toast-container');
            const toast = document.createElement('div');
            
            let bgClass = 'bg-blue-600';
            let icon = 'fa-info-circle';
            if (type === 'success') { bgClass = 'bg-green-600'; icon = 'fa-check-circle'; }
            if (type === 'error') { bgClass = 'bg-red-600'; icon = 'fa-exclamation-circle'; }
            if (type === 'warning') { bgClass = 'bg-yellow-500'; icon = 'fa-exclamation-triangle'; }

            toast.className = `toast ${bgClass} text-white px-6 py-3 rounded-lg shadow-lg flex items-center gap-3 font-medium`;
            toast.innerHTML = `<i class="fa-solid ${icon}"></i> ${message}`;
            
            container.appendChild(toast);
            
            // Trigger animation
            setTimeout(() => toast.classList.add('show'), 10);
            
            // Remove after 3 seconds
            setTimeout(() => {
                toast.classList.remove('show');
                setTimeout(() => toast.remove(), 300);
            }, 3000);
        }

        function renderLogs() {
            const tbody = document.getElementById('attendance-log-body');
            tbody.innerHTML = '';
            
            if (attendanceLogs.length === 0) {
                tbody.innerHTML = '<tr><td colspan="3" class="p-8 text-center text-gray-400">No scans recorded yet.</td></tr>';
                return;
            }

            // Sort logs by time (newest first)
            const sortedLogs = [...attendanceLogs].sort((a, b) => b.timestamp - a.timestamp);

            sortedLogs.forEach(log => {
                const date = new Date(log.timestamp);
                const timeString = date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second:'2-digit' });
                
                const tr = document.createElement('tr');
                tr.innerHTML = `
                    <td class="p-3 whitespace-nowrap text-gray-500">${timeString}</td>
                    <td class="p-3 font-medium text-gray-800">${log.name}</td>
                    <td class="p-3">
                        <span class="bg-green-100 text-green-800 text-xs px-2 py-1 rounded-full font-semibold border border-green-200">
                            <i class="fa-solid fa-check"></i> Present
                        </span>
                    </td>
                `;
                tbody.appendChild(tr);
            });
        }

        function renderUsers() {
            const list = document.getElementById('registered-users-list');
            const count = document.getElementById('user-count');
            const noMsg = document.getElementById('no-users-msg');
            
            count.innerText = registeredUsers.length;
            
            if (registeredUsers.length === 0) {
                list.innerHTML = '';
                if(noMsg) list.appendChild(noMsg);
                else list.innerHTML = '<li class="text-gray-400 italic w-full text-center py-4" id="no-users-msg">No faces registered. Please register a face first.</li>';
                return;
            }

            list.innerHTML = '';
            registeredUsers.forEach(user => {
                const li = document.createElement('li');
                li.className = 'bg-blue-50 border border-blue-100 text-blue-700 px-3 py-1 rounded-full text-sm font-medium flex items-center gap-2';
                li.innerHTML = `<i class="fa-regular fa-user"></i> ${user.label}`;
                list.appendChild(li);
            });
        }

        // Wait for all resources (including face-api.js) to be fully loaded
        window.addEventListener('load', () => {
            if (typeof faceapi === 'undefined') {
                showToast("Error: faceapi library failed to load. Please check your internet connection.", "error");
                statusBadge.className = 'bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-full flex items-center gap-2';
                statusBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Library Load Error';
                return;
            }

            // Load Models
            Promise.all([
                faceapi.nets.ssdMobilenetv1.loadFromUri(MODEL_URL),
                faceapi.nets.faceLandmark68Net.loadFromUri(MODEL_URL),
                faceapi.nets.faceRecognitionNet.loadFromUri(MODEL_URL)
            ]).then(() => {
                modelsLoaded = true;
                statusBadge.className = 'bg-green-500 text-white text-xs font-bold px-3 py-1 rounded-full flex items-center gap-2';
                statusBadge.innerHTML = '<i class="fa-solid fa-check-circle"></i> Models Loaded';
                console.log("Face API Models loaded.");
                
                // Build FaceMatcher if we have users
                buildFaceMatcher();
                
                // Start Camera
                startVideo();
            }).catch(err => {
                console.error("Error loading models:", err);
                statusBadge.className = 'bg-red-500 text-white text-xs font-bold px-3 py-1 rounded-full flex items-center gap-2';
                statusBadge.innerHTML = '<i class="fa-solid fa-triangle-exclamation"></i> Model Load Error';
                showToast("Failed to load facial recognition models. Check console.", "error");
            });
        });

        // Start Webcam
        function startVideo() {
            navigator.mediaDevices.getUserMedia({ video: { facingMode: 'user' } })
                .then(stream => {
                    video.srcObject = stream;
                    isCameraReady = true;
                })
                .catch(err => {
                    console.error("Error accessing webcam:", err);
                    showToast("Could not access webcam. Please grant permissions.", "error");
                    videoLoader.innerHTML = '<i class="fa-solid fa-video-slash text-4xl mb-2 text-red-500"></i><p>Camera access denied.</p>';
                });
        }

        
        // Convert stored Float32Array data (which is JSON stringified as regular arrays) back to Float32Array for face-api
        function buildFaceMatcher() {
            if (registeredUsers.length === 0) {
                faceMatcher = null;
                return;
            }

            const labeledDescriptors = registeredUsers.map(user => {
                // Convert array back to Float32Array
                const descriptors = user.descriptors.map(desc => new Float32Array(desc));
                return new faceapi.LabeledFaceDescriptors(user.label, descriptors);
            });

            // Threshold 0.6 is default. Lower is stricter.
            faceMatcher = new faceapi.FaceMatcher(labeledDescriptors, 0.55); 
        }

        // When video starts playing, setup canvas
        video.addEventListener('play', () => {
            videoLoader.style.display = 'none'; // Hide loader
            
            canvas = faceapi.createCanvasFromMedia(video);
            videoContainer.append(canvas);
            
            // Resize canvas to match video display size
            const displaySize = { width: video.clientWidth, height: video.clientHeight };
            faceapi.matchDimensions(canvas, displaySize);

            // Enable buttons
            btnScan.disabled = false;
            btnRegisterMode.disabled = false;

            // Start continuous detection loop for visual feedback
            detectionInterval = setInterval(async () => {
                if (video.paused || video.ended || !modelsLoaded) return;

                const detections = await faceapi.detectAllFaces(video).withFaceLandmarks();
                
                // We don't constantly recognize to save CPU, just draw box
                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                
                canvas.getContext('2d').clearRect(0, 0, canvas.width, canvas.height);
                
                // Change box color based on mode
                const boxColor = currentMode === 'register' ? 'blue' : 'green';
                faceapi.draw.drawDetections(canvas, resizedDetections, { withScore: false, boxColor: boxColor });
                
                if (currentMode === 'register' && resizedDetections.length > 1) {
                    // Give visual warning if multiple faces during registration
                    const ctx = canvas.getContext('2d');
                    ctx.fillStyle = 'red';
                    ctx.font = '16px Arial';
                    ctx.fillText('Multiple faces detected! Please ensure only 1 person is in frame.', 10, 20);
                }
            }, 100); // 10fps is enough for visual feedback
        });

        // Handle Window Resize to adjust canvas
        window.addEventListener('resize', () => {
            if(canvas && video.clientWidth > 0) {
                const displaySize = { width: video.clientWidth, height: video.clientHeight };
                faceapi.matchDimensions(canvas, displaySize);
            }
        });

        
        // Mode Switching
        btnRegisterMode.addEventListener('click', () => {
            currentMode = 'register';
            registrationPanel.classList.remove('hidden');
            btnScan.disabled = true;
            employeeNameInput.focus();
        });

        btnCancelRegister.addEventListener('click', () => {
            currentMode = 'scan';
            registrationPanel.classList.add('hidden');
            btnScan.disabled = false;
            employeeNameInput.value = '';
        });

        // Register Action
        btnSaveFace.addEventListener('click', async () => {
            const name = employeeNameInput.value.trim();
            if (!name) {
                showToast("Please enter a name.", "warning");
                return;
            }

            btnSaveFace.disabled = true;
            btnSaveFace.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Saving...';

            try {
                // Get high quality detection for registration
                const detection = await faceapi.detectSingleFace(video).withFaceLandmarks().withFaceDescriptor();

                if (!detection) {
                    showToast("No face detected. Please face the camera clearly.", "error");
                    throw new Error("No face");
                }

                // Check if user exists
                const existingUserIndex = registeredUsers.findIndex(u => u.label.toLowerCase() === name.toLowerCase());
                
                // Convert Float32Array to standard Array for JSON storage
                const descriptorArray = Array.from(detection.descriptor);

                if (existingUserIndex >= 0) {
                    // Update existing user (add new descriptor for better accuracy)
                    registeredUsers[existingUserIndex].descriptors.push(descriptorArray);
                    showToast(`Updated facial data for ${name}.`, "success");
                } else {
                    // New user
                    registeredUsers.push({
                        label: name,
                        descriptors: [descriptorArray]
                    });
                    showToast(`${name} registered successfully!`, "success");
                }

                // Save to storage
                localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(registeredUsers));
                
                // Rebuild matcher and UI
                buildFaceMatcher();
                renderUsers();

                // Reset UI
                employeeNameInput.value = '';
                btnCancelRegister.click(); // Close panel
                
            } catch (err) {
                console.error("Registration error:", err);
            } finally {
                btnSaveFace.disabled = false;
                btnSaveFace.innerHTML = 'Save Face';
            }
        });

        // Scan Action
        btnScan.addEventListener('click', async () => {
            if (!faceMatcher) {
                showToast("No users registered in the system.", "warning");
                return;
            }

            btnScan.disabled = true;
            const originalText = btnScan.innerHTML;
            btnScan.innerHTML = '<i class="fa-solid fa-spinner fa-spin"></i> Scanning...';

            try {
                // Detect faces and get descriptors
                const detections = await faceapi.detectAllFaces(video).withFaceLandmarks().withFaceDescriptors();

                if (detections.length === 0) {
                    showToast("No face detected. Please stand closer.", "warning");
                    return;
                }

                let foundMatch = false;
                const displaySize = { width: video.clientWidth, height: video.clientHeight };
                const resizedDetections = faceapi.resizeResults(detections, displaySize);
                const ctx = canvas.getContext('2d');

                detections.forEach((detection, i) => {
                    const bestMatch = faceMatcher.findBestMatch(detection.descriptor);
                    const box = resizedDetections[i].detection.box;
                    const drawBox = new faceapi.draw.DrawBox(box, { label: bestMatch.toString() });
                    drawBox.draw(canvas);

                    if (bestMatch.label !== 'unknown') {
                        foundMatch = true;
                        logAttendance(bestMatch.label);
                        showToast(`Check-in successful: ${bestMatch.label}`, "success");
                        
                        // Draw green box for success
                        ctx.strokeStyle = '#22c55e'; // Tailwind green-500
                        ctx.lineWidth = 4;
                        ctx.strokeRect(box.x, box.y, box.width, box.height);
                    } else {
                        // Draw red box for unknown
                         ctx.strokeStyle = '#ef4444'; // Tailwind red-500
                         ctx.lineWidth = 4;
                         ctx.strokeRect(box.x, box.y, box.width, box.height);
                    }
                });

                if (!foundMatch) {
                    showToast("Face not recognized. Please register first.", "error");
                }

            } catch (err) {
                console.error("Scanning error:", err);
                showToast("Error during scan.", "error");
            } finally {
                setTimeout(() => {
                    btnScan.disabled = false;
                    btnScan.innerHTML = originalText;
                }, 1500); // Prevent spam clicking
            }
        });

        function logAttendance(name) {
            // Check if already checked in recently (e.g., within last 1 minute) to prevent spam
            const oneMinuteAgo = Date.now() - 60000;
            const recentLog = attendanceLogs.find(log => log.name === name && log.timestamp > oneMinuteAgo);
            
            if (recentLog) {
                console.log(`Skipped logging for ${name}, already logged recently.`);
                return;
            }

            const logEntry = {
                id: Date.now().toString(),
                name: name,
                timestamp: Date.now()
            };
            
            attendanceLogs.push(logEntry);
            localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(attendanceLogs));
            renderLogs();
        }

        btnClearLogs.addEventListener('click', () => {
            if (confirm("Are you sure you want to clear today's attendance logs?")) {
                attendanceLogs = [];
                localStorage.setItem(STORAGE_KEY_LOGS, JSON.stringify(attendanceLogs));
                renderLogs();
                showToast("Logs cleared.", "info");
            }
        });

        btnClearUsers.addEventListener('click', () => {
            if (confirm("WARNING: This will delete ALL registered faces. Are you sure?")) {
                registeredUsers = [];
                localStorage.setItem(STORAGE_KEY_USERS, JSON.stringify(registeredUsers));
                faceMatcher = null;
                renderUsers();
                showToast("All user data deleted.", "info");
            }
        });

        // Initial Renders
        renderUsers();
        renderLogs();

    </script>
</body>
</html>
